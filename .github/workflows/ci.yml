name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose
  b1-stand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm i --frozen-lockfile
      - name: Build the Keycloak SMS extension
        run: pnpm --filter b1-phone-orgs run build:spi
      - name: Start Keycloak + Postgres
        run: pnpm --filter b1-phone-orgs run up
      - name: Scenarios S1-S6 on naive and fixed models
        run: pnpm --filter b1-phone-orgs run stand
      - if: failure()
        run: docker compose -f b1-phone-orgs/docker-compose.yml logs keycloak | tail -200
